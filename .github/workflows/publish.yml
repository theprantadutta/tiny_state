name: Publish to pub.dev

# Publishing is driven entirely by tags: push `v2.0.0` and this runs.
#
# Authentication uses pub.dev's automated publishing (OIDC), so there is no
# long-lived credential in this repository. It requires one-time setup on
# pub.dev — see RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Lets you rehearse the whole pipeline without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only, do not publish
        type: boolean
        default: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # Required for pub.dev to trust this workflow. Without it the publish
      # step falls back to interactive OAuth and hangs.
      id-token: write
    # A failed OIDC exchange makes `pub publish` wait on a browser prompt that
    # never comes. Bound it rather than burning the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check the tag matches pubspec.yaml and CHANGELOG.md
        if: github.event_name == 'push'
        run: bash tool/check_version.sh "${{ github.ref_name }}"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Validate the published archive
        run: flutter pub publish --dry-run

      # Provisions the pub.dev OIDC token as PUB_TOKEN. Without it, publishing
      # falls back to interactive OAuth and blocks forever on a runner.
      #
      # This runs LAST on purpose. The token is publish-scoped, and pub attaches
      # it to every pub.dev request once it is in the environment - including
      # dependency reads, which pub.dev then rejects with "Insufficient
      # permissions", breaking `pub get` and the dry run. Resolution above
      # therefore happens before the token exists, and has already warmed
      # PUB_CACHE by the time we publish.
      - uses: dart-lang/setup-dart@v1
        if: github.event_name == 'push' || inputs.dry_run == false

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: flutter pub publish --force
