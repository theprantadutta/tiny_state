name: tiny_state
description: "A tiny, zero-dependency, global reactive state manager for Flutter. Feels like a ValueNotifier, but global, keyed, and with computed state built in."
version: 2.0.0
homepage: https://github.com/theprantadutta/tiny_state
repository: https://github.com/theprantadutta/tiny_state
issue_tracker: https://github.com/theprantadutta/tiny_state/issues
topics:
  - state-management
  - reactive
  - state
  - valuenotifier

screenshots:
  - description: "Core API: watch, get, set, update, reset, select and listen."
    path: screenshots/basics_screen.jpg
  - description: "Computed state derived from a list of models."
    path: screenshots/todos_screen.jpg
  - description: "Computed state across multiple inputs, plus a persisted theme."
    path: screenshots/profile_screen.jpg
  - description: "Two independent counters isolated with scopes."
    path: screenshots/scopes_screen.jpg

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
